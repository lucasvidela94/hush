name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      - name: Vet and test
        run: |
          go generate ./...
          go vet ./...
          go test ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      attestations: write # build provenance
      id-token: write # build provenance
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VER=$(grep '"version"' package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$PKG_VER" ]; then
            echo "❌ Tag v$TAG but package.json says $PKG_VER"
            echo "   Fix: ./scripts/release.sh $TAG"
            exit 1
          fi
          echo "✅ Version match: v$TAG"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      - name: Build binary
        run: |
          go generate ./...
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "hush-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/hush
          gzip -9 -k "hush-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hush-${{ matrix.goos }}-${{ matrix.goarch }}.gz
          path: hush-${{ matrix.goos }}-${{ matrix.goarch }}.gz

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: hush-${{ matrix.goos }}-${{ matrix.goarch }}.gz

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/

      - name: Prepare npm package
        run: |
          mkdir -p publish/bin
          find artifacts/ -name "*.gz" -exec cp {} publish/bin/ \;
          cp package.json publish/
          cp README.md publish/
          cp SKILL.md publish/
          cp install.js publish/
          cp uninstall.js publish/

      - name: Publish to npm (OIDC)
        run: |
          cd publish
          npm publish --access public

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/

      - name: Checksums
        run: |
          cd artifacts
          for d in */; do (cd "$d" && sha256sum *.gz); done > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: hush ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.gz
            artifacts/checksums.txt
