name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # Required for npm Trusted Publishing (OIDC)

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VER=$(grep '"version"' package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$PKG_VER" ]; then
            echo "❌ Tag v$TAG but package.json says $PKG_VER"
            echo "   Fix: ./scripts/release.sh $TAG"
            exit 1
          fi
          echo "✅ Version match: v$TAG"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binary
        run: |
          go generate ./...
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "hush-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/hush
          gzip -9 -k "hush-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: hush-${{ matrix.goos }}-${{ matrix.goarch }}.gz
          path: hush-${{ matrix.goos }}-${{ matrix.goarch }}.gz

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare npm package
        run: |
          mkdir -p publish/bin
          find artifacts/ -name "*.gz" -exec cp {} publish/bin/ \;
          cp package.json publish/
          cp README.md publish/
          cp SKILL.md publish/
          cp install.js publish/
          cp uninstall.js publish/

      # Fallback when npm Trusted Publishing (OIDC) is not configured yet:
      # set the NPM_TOKEN repo secret to a granular automation token.
      - name: npm auth (fallback token)
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> publish/.npmrc

      - name: Publish to npm (OIDC)
        run: |
          cd publish
          npm publish --access public

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Checksums
        run: |
          cd artifacts
          sha256sum */*.gz > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: hush ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.gz
            artifacts/checksums.txt
